<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Places to Visit - Kashi Yatra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="/">🛕 Kashi Yatra</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-menu navbar-nav ms-auto" id="auth-nav">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/places">Places</a></li>
                    <li class="nav-item"><a class="nav-link" href="/hotels">Hotels</a></li>
                    <li class="nav-item"><a class="nav-link" href="/restaurants">Restaurants</a></li>
                    <li class="nav-item"><a class="nav-link" href="/trip-planner">Planner</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">Places to Visit in Kashi</h1>
            <p class="lead">Temples, ghats and heritage sites across the world's oldest living city.</p>
        </div>
    </header>

    <main class="container my-5">
        <div class="d-flex flex-wrap gap-2 mb-4" id="category-filters">
            <button class="btn btn-outline-secondary btn-sm active" data-category="">All</button>
            <button class="btn btn-outline-secondary btn-sm" data-category="Temple">Temples</button>
            <button class="btn btn-outline-secondary btn-sm" data-category="Ghat">Ghats</button>
            <button class="btn btn-outline-secondary btn-sm" data-category="Historical">Historical</button>
            <button class="btn btn-outline-secondary btn-sm" data-category="Cultural">Cultural</button>
        </div>
        <div class="row g-4" id="places-list">
            <p class="text-muted">Loading places…</p>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4">
        <p class="mb-0">&copy; 2026 Kashi Tourism & Smart Planner. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        async function loadPlaces(category = '') {
            const container = document.getElementById('places-list');
            container.innerHTML = '<p class="text-muted">Loading places…</p>';
            const url = category ? `/api/places?category=${encodeURIComponent(category)}` : '/api/places';
            const res = await fetch(url);
            const data = await res.json();
            if (!data.places || data.places.length === 0) {
                container.innerHTML = '<p class="text-muted">No places found in this category.</p>';
                return;
            }
            container.innerHTML = data.places.map(place => `
                <div class="col-md-4">
                    <div class="card h-100">
                        <img src="${place.image_url}" class="card-img-top" alt="${place.name}">
                        <div class="card-body">
                            <span class="badge bg-warning text-dark mb-2">${place.category}</span>
                            <h5 class="card-title">${place.name}</h5>
                            <p class="card-text">${place.description}</p>
                            <p class="text-muted small mb-1">📍 ${place.location}</p>
                            <p class="text-muted small mb-1">🕐 ${place.visiting_hours}</p>
                            <p class="text-muted small">⏱️ ${place.estimated_duration}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.querySelectorAll('#category-filters button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#category-filters button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadPlaces(btn.dataset.category);
            });
        });

        loadPlaces();
    </script>
</body>
</html>
