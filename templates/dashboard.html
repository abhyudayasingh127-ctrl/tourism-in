<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Dashboard - Kashi Yatra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand text-warning" href="/">🛕 Kashi Yatra</a>
            <a href="/" class="btn btn-outline-light btn-sm">Home</a>
        </div>
    </nav>

    <div class="container my-5">
        <h2>My Saved Trips</h2>
        <div id="trips-list" class="row g-4 mt-2"></div>
    </div>

    <script>
        fetch('/api/trips')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('trips-list');
                if (!data.trips || data.trips.length === 0) {
                    container.innerHTML = `<p class="text-muted">No trips created yet. Use the <a href="/trip-planner">Planner</a> to build one!</p>`;
                    return;
                }
                data.trips.forEach(trip => {
                    let placesHtml = trip.places.map(p => `<li>Day ${p.day_number}: <b>${p.name}</b> (${p.category})</li>`).join('');
                    container.innerHTML += `
                        <div class="col-md-6">
                            <div class="card p-3">
                                <h4>${trip.trip_name}</h4>
                                <p class="text-muted mb-1">Start Date: ${trip.start_date} | Duration: ${trip.number_of_days} Days</p>
                                <p><strong>Budget:</strong> ${trip.budget}</p>
                                <h6>Itinerary Schedule:</h6>
                                <ul>${placesHtml}</ul>
                            </div>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
