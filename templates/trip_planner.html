<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Trip Planner - Kashi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand text-warning" href="/">🛕 Kashi Yatra</a>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">Generate Your Custom Smart Itinerary</h2>
        <div class="row">
            <div class="col-md-5">
                <div class="card p-4">
                    <form id="planner-form">
                        <div class="mb-3">
                            <label class="form-label">Trip Title</label>
                            <input type="text" id="trip_name" class="form-control" placeholder="My Kashi Pilgrimage" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="date" id="start_date" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Number of Days</label>
                            <input type="number" id="days" class="form-control" min="1" max="7" value="3" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Budget Level</label>
                            <select id="budget" class="form-select">
                                <option>Budget</option>
                                <option selected>Moderate</option>
                                <option>Luxury</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Generate & Save Itinerary</button>
                    </form>
                </div>
            </div>
            <div class="col-md-7">
                <div id="itinerary-result" class="card p-4 d-none">
                    <h3 class="text-success mb-3">Your Itinerary is Ready!</h3>
                    <div id="itinerary-details"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('planner-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                trip_name: document.getElementById('trip_name').value,
                start_date: document.getElementById('start_date').value,
                number_of_days: document.getElementById('days').value,
                budget: document.getElementById('budget').value
            };

            const res = await fetch('/api/trips', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (res.ok) {
                alert('Trip generated successfully!');
                window.location.href = '/dashboard';
            } else {
                alert(data.error || 'Please login to save your trip.');
                if (res.status === 401) window.location.href = '/login';
            }
        });
    </script>
</body>
</html>
